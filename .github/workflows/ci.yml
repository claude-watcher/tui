name: ci

# Tests, lint and shared-core parity on every PR and push to main.
# The app ships as a single script with no packaging, and the tests stub
# rich/textual (see tests/conftest.py), so `--no-project` keeps CI to a plain
# interpreter + pytest — nothing to install, nothing to lock.
# pytest-timeout is pulled in because pyproject.toml sets `timeout = 60`: without
# the plugin the key is silently ignored and a hung stop() burns the whole job.

on:
  push:
    branches: [main, master, develop, trunk]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Le cœur « sessions distantes » est porté à l'identique par le widget GTK,
      # et tests/test_core_parity.py le vérifie symbole par symbole. Sans ce
      # checkout le test ÉCHOUE (CI est posé) au lieu de skipper : un garde-fou
      # qui ne tourne jamais ne garde rien.
      #
      # Le MÊME checkout existe en miroir dans le dépôt GTK. Il le faut des deux
      # côtés : tant qu'il n'était que là-bas, une modification du cœur livrée
      # en PR sur CE dépôt passait au vert ici et faisait rougir, plus tard, une
      # PR GTK sans rapport — en accusant le mauvais auteur.
      #
      # Branche à branche quand le même nom existe des deux côtés (une
      # modification du cœur partagé arrive sous un seul nom de branche dans les
      # deux dépôts), branche par défaut sinon. Corollaire, et c'est une
      # CONTRAINTE D'ORDONNANCEMENT, pas un défaut : une modification du cœur
      # n'est verte ici qu'une fois sa jumelle poussée sur le dépôt GTK.
      #
      # La révision est RÉSOLUE D'ABORD, puis extraite UNE FOIS. La forme
      # précédente — tenter la branche en continue-on-error, puis un repli —
      # cassait dès que la branche jumelle était fusionnée et supprimée : la
      # tentative ratée laissait `_gtk` en NON-dépôt, et le repli mourait sur
      # `git reset --hard HEAD`, si bien que le garde de parité comparait un
      # module vide et déclarait tous les symboles partagés manquants.
      #
      # Une PR venue d'un fork pousse sa jumelle sur ce même fork, jamais ici :
      # la jumelle est cherchée d'abord dans le fork de l'auteur de la PR (censé
      # garder le nom du dépôt), puis ici. Ne chercher qu'ici comparait une PR
      # de fork au GTK d'avant la modification : un changement du cœur partagé
      # venu d'un fork était rouge des deux côtés jusqu'à ce qu'on en fusionne
      # un en rouge.
      #
      # Branche et propriétaire du fork passent par env, pas par `${{ }}` en
      # ligne : le nom de branche d'une PR de fork est contrôlé par l'attaquant
      # et serait injecté tel quel dans le script.
      - name: Resolve the GTK widget revision
        id: sibling
        env:
          BRANCH: ${{ github.head_ref || github.ref_name }}
          FORK_OWNER: ${{ github.event.pull_request.head.repo.fork && github.event.pull_request.head.repo.owner.login || '' }}
        run: |
          set -euo pipefail
          repo="claude-watcher/gtk"
          ref=""
          for owner in ${FORK_OWNER:+"$FORK_OWNER"} claude-watcher; do
            if git ls-remote --exit-code --heads \
                 "https://github.com/$owner/gtk.git" "$BRANCH" >/dev/null 2>&1; then
              repo="$owner/gtk"
              ref="$BRANCH"
              break
            fi
          done
          echo "gtk=$repo@${ref:-<branche par défaut>}"
          echo "repo=$repo" >> "$GITHUB_OUTPUT"
          echo "ref=$ref" >> "$GITHUB_OUTPUT"

      - name: Checkout the GTK widget (shared core)
        uses: actions/checkout@v4
        with:
          repository: ${{ steps.sibling.outputs.repo }}
          ref: ${{ steps.sibling.outputs.ref }}
          path: _gtk

      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      - name: Pytest
        run: uv run --no-project --with pytest --with pytest-timeout pytest tests/ -q

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      # LA MÊME commande que le hook local, pas une réplique de deux de ses
      # étapes : rejouer seulement ruff et mypy laissait passer les six autres
      # hooks (fin de fichier, espaces en fin de ligne, YAML/TOML, clé privée,
      # shebangs) chez un contributeur sans pre-commit installé.
      - name: Pre-commit
        run: uvx pre-commit@4.4.0 run --all-files --show-diff-on-failure
